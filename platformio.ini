; SimHub Racing Dashboard for JC3248W535C ESP32-S3
; Based on proven Arduino + native esp_lcd driver approach

[platformio]
default_envs = jc3248w535c
src_dir = src

[env:jc3248w535c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino

board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lvgl/lvgl@^8.4.0

build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I$PROJECT_SRC_DIR
    -I$PROJECT_SRC_DIR/bsp
    -DCORE_DEBUG_LEVEL=1
    -DESP_LCD_AXS15231B_VER_MAJOR=1

lib_archive = no
